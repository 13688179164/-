<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOODWORK 报销审批 · staging</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">GOODWORK <span>报销审批</span><em>staging</em></div>
  <div id="userBox" class="userbox hidden">
    <span id="userName"></span>
    <span id="userRole" class="role"></span>
    <button id="logoutBtn" class="ghost">退出</button>
  </div>
</header>

<main>
  <section id="loginView" class="login-wrap">
    <div class="card login-card">
      <h1>账号登录</h1>
      <p class="muted">使用管理员开通的用户名和密码登录。</p>
      <label>用户名<input id="loginUser" autocomplete="username" placeholder="请输入用户名"></label>
      <label>密码<input id="loginPass" type="password" autocomplete="current-password" placeholder="请输入密码"></label>
      <button id="loginBtn" class="primary">登录</button>
      <p id="loginMsg" class="msg"></p>
    </div>
  </section>

  <section id="appView" class="hidden">
    <div class="layout">
      <aside class="card form-card">
        <h2>新建报销</h2>
        <p class="muted" id="formHint">提交后进入待审批，需管理员审批。</p>
        <label>金额（元）<input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00"></label>
        <label>部门
          <select id="department">
            <option>维保</option><option>改装</option><option>洗美</option><option>贴膜</option>
            <option>门店运维</option><option>福利费</option><option>货运物流</option><option>打车费</option>
            <option>停车费</option><option>财务费用</option><option>其他</option>
          </select>
        </label>
        <label>分类
          <select id="category">
            <option>配件</option><option>工时</option><option>费用</option><option>采购</option><option>其他</option>
          </select>
        </label>
        <label>发生日期<input id="appliedAt" type="date"></label>
        <label>说明<textarea id="content" rows="3" placeholder="用途、事由"></textarea></label>
        <label class="check"><input id="hasInvoice" type="checkbox"> 有发票</label>
        <label>附件（可多选，图片会自动压缩）<input id="files" type="file" multiple accept="image/*,.pdf"></label>
        <div class="actions">
          <button id="createBtn" class="primary">保存并提交</button>
          <button id="draftBtn" class="ghost">仅存草稿</button>
        </div>
        <p id="formMsg" class="msg"></p>
      </aside>

      <section class="list-area">
        <div class="toolbar card">
          <h2 id="listTitle">报销记录</h2>
          <div class="filters">
            <select id="statusFilter">
              <option value="all">全部状态</option>
              <option value="draft">草稿</option>
              <option value="submitted">待审批</option>
              <option value="approved">待报销</option>
              <option value="reimbursed">已报销</option>
              <option value="rejected">已驳回</option>
              <option value="cancelled">已撤销</option>
            </select>
            <button id="refreshBtn" class="ghost">刷新</button>
            <button id="exportBtn" class="ghost hidden">导出 Excel</button>
          </div>
        </div>
        <div id="list" class="list"></div>
      </section>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="./vendor/exceljs.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
