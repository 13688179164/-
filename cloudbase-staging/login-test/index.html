<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录测试</title>
<style>body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 20px}input,button{width:100%;padding:10px;margin:6px 0;font-size:16px}pre{background:#f5f5f8;padding:12px;white-space:pre-wrap;font-size:12px}</style>
</head>
<body>
<h2>GOODWORK 登录测试</h2>
<input id="u" placeholder="用户名" value="1258046614">
<input id="p" type="password" placeholder="密码">
<button id="login">登录并调用 whoami</button>
<button id="logout">退出</button>
<pre id="out">等待操作…</pre>
<script type="module">
import cloudbase from './vendor/cloudbase-v3.esm.js';
const ENV = 'ready-puma-d4gmuy5yeca0a8f3c';
const app = cloudbase.init({ env: ENV });
const auth = app.auth();
const out = document.getElementById('out');
const show = (o) => { out.textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 2); console.log(o); };
document.getElementById('login').onclick = async () => {
  try {
    show('登录中…');
    await auth.signInWithUsernameAndPassword(document.getElementById('u').value.trim(), document.getElementById('p').value);
    const state = await auth.getLoginState();
    const res = await app.callFunction({ name: 'whoami', data: { ping: 1 } });
    show({ login: state ? { uid: state.user?.uid, username: state.user?.username, isAnonymous: state.isAnonymous } : null, whoami: res.result });
  } catch (e) {
    show({ error: String(e), message: e?.message, code: e?.code });
  }
};
document.getElementById('logout').onclick = async () => { try { await auth.signOut(); show('已退出'); } catch(e){ show(String(e)); } };
</script>
</body></html>
